packages:
  - docs
  - packages/**
  - '!packages/nuxi'
  - '!packages/test-utils'
  - '!packages/nuxt/test/package-fixture/pkg'
  - playground
  - test/fixtures/*
  - test/fixtures/*/_local-modules/*

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - oxc-resolver
  - unrs-resolver

patchedDependencies:
  changelogen: patches/changelogen.patch

publicHoistPattern:
  - '*-loader'
  - 'webpack-*'

shellEmulator: true

verifyDepsBeforeRun: install

ignoreWorkspaceCycles: true

overrides:
  "@nuxt/kit": "workspace:*"
  "@nuxt/nitro-server": "workspace:*"
  "@nuxt/rspack-builder": "workspace:*"
  "@nuxt/schema": "workspace:*"
  "@nuxt/vite-builder": "workspace:*"
  "@nuxt/webpack-builder": "workspace:*"
  "@vue/compiler-core": "3.5.34"
  "@vue/compiler-dom": "3.5.34"
  "@vue/shared": "3.5.34"
  nuxt: "workspace:*"
  send: ">=1.2.1"
  vite: "8.0.10"
  vue: "3.5.34"
  'undici@6.29.1': '7.30.1' # lockwright: GHSA-2gqq-gqf2-x968, GHSA-2jfj-6hjv-fm6j, GHSA-2m5v-pch6-74hx, GHSA-35p6-xmwp-9g52, GHSA-3wwx-pv8p-q78v, GHSA-3xpg-4rpp-hhhm, GHSA-4cwx-7wf7-3272, GHSA-4qv8-2p9j-2685, GHSA-4w7w-5xrc-9h26, GHSA-55wc-3pg8-jfw6, GHSA-8436-99hf-9mmv, GHSA-8xcm-r25x-g524, GHSA-9fm3-97px-rjf6, GHSA-f72v-6w45-q472, GHSA-g8m3-5g58-fq7m, GHSA-hm92-r4w5-c3mj, GHSA-jr45-8vmc-qm54, GHSA-m8rv-5g2x-5cg5, GHSA-p88m-4jfj-68fv, GHSA-pmjh-fq2x-6v4x, GHSA-pr7r-676h-xcf6, GHSA-qrxm-fqhp-jwvm, GHSA-r53p-7pc4-xj5r, GHSA-rfgv-xxqx-mfg5, GHSA-rx4f-c7p8-82vq, GHSA-v3r7-h72x-cjcm, GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q, GHSA-w293-vg96-wgc3, GHSA-xjj6-f33q-929c
