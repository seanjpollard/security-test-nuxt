packages:
  - docs
  - packages/**
  - '!packages/nuxi'
  - '!packages/test-utils'
  - '!packages/nuxt/test/package-fixture/pkg'
  - playground
  - test/fixtures/*
  - test/fixtures/*/_local-modules/*

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - oxc-resolver
  - unrs-resolver

patchedDependencies:
  changelogen: patches/changelogen.patch

publicHoistPattern:
  - '*-loader'
  - 'webpack-*'

shellEmulator: true

verifyDepsBeforeRun: install

ignoreWorkspaceCycles: true

overrides:
  "@nuxt/kit": "workspace:*"
  "@nuxt/nitro-server": "workspace:*"
  "@nuxt/rspack-builder": "workspace:*"
  "@nuxt/schema": "workspace:*"
  "@nuxt/vite-builder": "workspace:*"
  "@nuxt/webpack-builder": "workspace:*"
  "@vue/compiler-core": "3.5.34"
  "@vue/compiler-dom": "3.5.34"
  "@vue/shared": "3.5.34"
  nuxt: "workspace:*"
  send: ">=1.2.1"
  vite: "8.0.10"
  vue: "3.5.34"
  'markdown-it@14.1.1': '14.3.3' # lockwright: GHSA-253c-mchw-3w2r, GHSA-6v5v-wf23-fmfq, GHSA-gfr2-rv44-r23c, GHSA-r7fv-28h4-cvq7, GHSA-vfgh-jcmw-g37q
