packages:
  - docs
  - packages/**
  - '!packages/nuxi'
  - '!packages/test-utils'
  - '!packages/nuxt/test/package-fixture/pkg'
  - playground
  - test/fixtures/*
  - test/fixtures/*/_local-modules/*

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - oxc-resolver
  - unrs-resolver

patchedDependencies:
  changelogen: patches/changelogen.patch

publicHoistPattern:
  - '*-loader'
  - 'webpack-*'

shellEmulator: true

verifyDepsBeforeRun: install

ignoreWorkspaceCycles: true

overrides:
  "@nuxt/kit": "workspace:*"
  "@nuxt/nitro-server": "workspace:*"
  "@nuxt/rspack-builder": "workspace:*"
  "@nuxt/schema": "workspace:*"
  "@nuxt/vite-builder": "workspace:*"
  "@nuxt/webpack-builder": "workspace:*"
  "@vue/compiler-core": "3.5.34"
  "@vue/compiler-dom": "3.5.34"
  "@vue/shared": "3.5.34"
  nuxt: "workspace:*"
  send: ">=1.2.1"
  vite: "8.0.10"
  vue: "3.5.34"
  'brace-expansion@1.1.22': '5.0.12' # lockwright: GHSA-3jxr-9vmj-r5cp, GHSA-6j4f-fj2g-mc7p, GHSA-jxxr-4gwj-5jf2, GHSA-mh99-v99m-4gvg, GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, GHSA-rgw5-rvv9-x895
  'brace-expansion@2.1.8': '5.0.12' # lockwright: GHSA-3jxr-9vmj-r5cp, GHSA-6j4f-fj2g-mc7p, GHSA-jxxr-4gwj-5jf2, GHSA-mh99-v99m-4gvg, GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, GHSA-rgw5-rvv9-x895
